apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{ .Values.namespace }}
  name: ecom-ingress
spec:
  ingressClassName: nginx
  tls:
  - hosts:
      - localhost
    secretName: ecom-tls-secret
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecom-frontend-service
            port:
              number: {{ .Values.service.frontend_port }}
      - path: /api/orders/
        pathType: Prefix
        backend:
          service:
            name: ecom-order-svc
            port:
              number: {{ .Values.service.order_port }}
      - path: /api/cart/
        pathType: Prefix
        backend:
          service:
            name: ecom-cart-svc
            port:
              number: {{ .Values.service.cart_port }}
      - path: /api/users/
        pathType: Prefix
        backend:
          service:
            name: ecom-user-svc
            port:
              number: {{ .Values.service.user_port }}
      - path: /api/
        pathType: Prefix
        backend:
          service:
            name: ecom-product-svc
            port:
              number: {{ .Values.service.product_port }}