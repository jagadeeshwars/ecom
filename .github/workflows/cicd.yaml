on:
  push:
    branches:
      - main

jobs:
   docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:${{ github.run_id }}
      
      - name: Build and push product service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/product-service
          file: ./backend/product-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-product:${{ github.run_id }}
          
      - name: Build and push user service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/user-service
          file: ./backend/user-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-user:${{ github.run_id }}

      - name: Build and push cart service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/cart-service
          file: ./backend/cart-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-cart:${{ github.run_id }} 
          
      - name: Build and push notification service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/notification-service
          file: ./backend/notification-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-notify:${{ github.run_id }} 
          
      - name: Build and push order service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/order-service
          file: ./backend/order-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ecom-order:${{ github.run_id }} 
  
    update-newtag-in-helm-chart:
      runs-on: ubuntu-latest

      needs: docker

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4
          with:
            token: ${{ secrets.TOKEN }}

        - name: Update tag in Helm chart
          run: |
            sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/ecom/values.yaml

        - name: Commit and push changes
          run: |
            git config --global user.email "jagadeesh80155@gmail.com"
            git config --global user.name "jagadeeshwars"
            git add helm/ecom/values.yaml
            git commit -m "Update tag in Helm chart"
            git push